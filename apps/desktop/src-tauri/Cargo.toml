[package]
name = "spm-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"
default-run = "spm-desktop"

[lints]
workspace = true

[lib]
name = "spm_desktop"
path = "src/lib.rs"

[[bin]]
name = "spm-desktop"
path = "src/main.rs"

[features]
# Set by `tauri build`: Tauri's own asset protocol serves the embedded frontend instead of the dev
# URL. This app loads its UI from its own loopback listener, so the flag changes nothing we use;
# Tauri's CLI passes it anyway.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
spm-core.workspace = true
spm-http.workspace = true
spm-shell.workspace = true
# `unstable` is the multiwebview API (`Window::add_child`) the model browser needs in part 3;
# `devtools` keeps the developer tools in the View menu in release builds, as the Electron app had.
tauri = { version = "2.12.5", features = ["unstable", "devtools"] }
tauri-plugin-dialog = "2.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
sys-locale = "0.3"
open = "5.4"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
spm-core = { workspace = true, features = ["testing"] }
spm-http.workspace = true
axum.workspace = true
tokio.workspace = true
serde_json = "1"
tempfile = "3"
flate2 = "1.1"
