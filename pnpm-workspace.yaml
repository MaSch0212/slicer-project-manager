packages:
  - packages/*

# @awdlab/jig and @awdlab/jig-themes are published with their source package.json at the package
# root (no exports/main/module/typings — the real manifest is nested at dist/package.json). These
# patches splice the dist manifest's fields into the root manifest, dist-prefixed, so Node, tsc,
# vitest, and Angular's esbuild bundler can all resolve the packages. See packages/web/README.md.
# Delete once a release ships a root package.json with its own exports field.
patchedDependencies:
  '@awdlab/jig-themes@0.0.4': patches/@awdlab__jig-themes@0.0.4.patch
  '@awdlab/jig@0.0.4': patches/@awdlab__jig@0.0.4.patch
