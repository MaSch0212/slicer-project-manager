[workspace]
resolver = "3"
members = ["crates/spm-core", "crates/spm-http", "crates/spm-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
spm-core = { path = "crates/spm-core" }
spm-http = { path = "crates/spm-http" }
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "time", "sync", "signal"] }
tower = { version = "0.5", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# PBKDF2 at 600 000 iterations dominates the auth tests; optimise dependencies (sha2, pbkdf2, ...)
# even in debug builds so a test that hashes a password takes tenths of a second.
[profile.dev.package."*"]
opt-level = 2
