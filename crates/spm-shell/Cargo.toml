[package]
name = "spm-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[dependencies]
spm-core = { workspace = true, features = ["desktop"] }
spm-http.workspace = true
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tokio-util = { version = "0.7", features = ["io", "io-util"] }
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = [
  "native-tls",
  "stream",
  "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.23"
notify = "8"
getrandom = "0.4"
subtle = "2.6"
rust-embed = { version = "8.13", default-features = false, features = [
  "debug-embed",
  "interpolate-folder-path",
] }

[dev-dependencies]
spm-core = { workspace = true, features = ["testing"] }
tempfile = "3"
flate2 = "1.1"
rusqlite = "0.41"
