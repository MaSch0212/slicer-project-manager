[package]
name = "spm-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[lib]
name = "spm_server"
path = "src/lib.rs"

[[bin]]
name = "spm-server"
path = "src/main.rs"

[dependencies]
spm-core.workspace = true
spm-http.workspace = true
axum.workspace = true
tokio.workspace = true
rust-embed = { version = "8.13", default-features = false, features = ["debug-embed", "interpolate-folder-path"] }

[dev-dependencies]
spm-core = { workspace = true, features = ["testing"] }
tempfile = "3"
serde_json = "1"
