[package]
name = "spm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test support (`spm_core::testing`): temp libraries and seed helpers shared with the other crates'
# tests. Never enabled in a release build.
testing = ["dep:tempfile"]
# Desktop-only file handling: `files::strip3mf`, `files::zip_write` and `files::entry_hash`
# (subsystem D). The server must never ship them, so spm-http and spm-server never enable this
# feature; the `server_boundary` integration test fails if either does. Core's own tests enable
# it through the dev-dependency below, so `cargo test` and clippy always cover these modules.
desktop = ["dep:crc32fast", "dep:regex"]

[dependencies]
base64 = "0.23"
crc32fast = { version = "1.5", optional = true }
flate2 = "1.1"
getrandom = "0.4"
memchr = "2.8"
pbkdf2 = "0.13"
regex = { version = "1.13", optional = true }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2.6"
tempfile = { version = "3", optional = true }
time = { version = "0.3", features = ["formatting"] }
ts-rs = { version = "12", features = ["serde-compat", "no-serde-warnings"] }
unicode-normalization = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
spm-core = { path = ".", features = ["testing", "desktop"] }
tempfile = "3"
# A counting global allocator for `tests/memory.rs`. The workspace forbids `unsafe`, which an
# allocator impl needs, so the wrapper comes from this crate instead of being written in the test.
peak_alloc = "0.3"

[lints]
workspace = true
