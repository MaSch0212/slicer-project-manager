name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      # `pnpm typecheck` runs `deno check` over the server entry points: plain tsc cannot
      # type-check the server (it uses Deno globals), so this job needs Deno as much as
      # core-deno and server do. It then runs `ngc --noEmit` over packages/web, which
      # compiles the Angular templates too — the web job's `ng build` is no longer the only
      # thing that proves the client compiles.
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  core-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:core:node

  core-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:core:deno

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:server

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:web
      - run: pnpm --filter @spm/web exec ng build
      - run: pnpm --filter @spm/web exec ng build --configuration=electron
      # The web build must physically exclude desktop-only code (spec 2.5), and the electron
      # build must keep it. Grepping the exported class name, not the module path: paths are
      # rewritten to hashed chunk names during bundling, so a path grep can never fail.
      - name: web bundle carries no desktop code
        run: |
          if grep -rl DesktopPlaceholderPage packages/web/dist/web/browser; then
            echo "::error::desktop-only code leaked into the web bundle"; exit 1
          fi
      - name: electron bundle carries desktop code
        run: |
          grep -rl DesktopPlaceholderPage packages/web/dist/electron/browser \
            || { echo "::error::fileReplacements did not swap in the electron routes"; exit 1; }

  e2e:
    runs-on: ubuntu-latest
    # A hung webServer would otherwise sit on the runner default of six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spm/web exec playwright install --with-deps chromium
      - run: pnpm e2e
