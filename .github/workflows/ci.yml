name: ci
on:
  push: { branches: [main] }
  pull_request:

# Deno owns installation, the workspace, the server and core. The Angular toolchain still runs
# under Node: `ng test` hangs on a Linux runner under Deno's Node compatibility layer, emitting
# no output at all until the job is killed, though it is fine on Windows and fine under Node
# everywhere. So every job that runs ng, ngc, Playwright or `node --test` installs Node as well
# — all of them read the same node_modules that `deno install` writes.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      # `deno task typecheck` runs `deno check` over everything written against Deno globals —
      # the server entry points and the e2e seed script, neither of which plain tsc can read —
      # and tsc or `ngc --noEmit` over the rest. ngc compiles the Angular templates too, so the
      # web job's `ng build` is no longer the only thing that proves the client compiles, and
      # the Playwright sources under packages/web/e2e are checked here rather than only by
      # Playwright's own runtime transform.
      - run: deno install --allow-scripts --frozen
      - run: deno task lint
      - run: deno task fmt:check
      - run: deno task typecheck

  core-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: deno install --allow-scripts --frozen
      - run: deno task test:contract
      - run: deno task test:core:node

  core-deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno install --allow-scripts --frozen
      - run: deno task test:core:deno

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno install --allow-scripts --frozen
      - run: deno task test:server

  web:
    runs-on: ubuntu-latest
    # ng test hung here once and sat until the run was cancelled; fail in ten minutes instead.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: deno install --allow-scripts --frozen
      - run: deno task test:web
      - run: deno task build:ui
      - run: cd packages/web && node node_modules/@angular/cli/bin/ng.js build --configuration=electron
      # The web build must physically exclude desktop-only code (spec 2.5), and the electron
      # build must keep it. Grepping the exported class name, not the module path: paths are
      # rewritten to hashed chunk names during bundling, so a path grep can never fail.
      - name: web bundle carries no desktop code
        run: |
          if grep -rl DesktopPlaceholderPage packages/web/dist/web/browser; then
            echo "::error::desktop-only code leaked into the web bundle"; exit 1
          fi
      - name: electron bundle carries desktop code
        run: |
          grep -rl DesktopPlaceholderPage packages/web/dist/electron/browser \
            || { echo "::error::fileReplacements did not swap in the electron routes"; exit 1; }

      # Same shape, for the second fileReplacement: API_CLIENT resolves to IpcApiClient in the
      # electron build and to HttpApiClient in the web one. The marker is a string literal from
      # ipc-api-client.ts (BRIDGE_MISSING) and not the class name, because the minifier renames
      # classes and cannot touch a string -- and a marker that matches nothing is a failure here
      # too, which is what the `||` below makes the electron case say.
      - name: web bundle carries no IPC transport
        run: |
          if grep -rl "the desktop IPC bridge is missing" packages/web/dist/web/browser; then
            echo "::error::IpcApiClient leaked into the web bundle"; exit 1
          fi
      - name: electron bundle carries the IPC transport
        run: |
          grep -rl "the desktop IPC bridge is missing" packages/web/dist/electron/browser \
            || { echo "::error::fileReplacements did not swap in the electron API_CLIENT"; exit 1; }

      # three.js is 600 kB of the viewer chunk and the only thing keeping it out of the first
      # payload is the lazy route boundary in routes.shared.ts. An ordinary-looking `import
      # { Vector3 } from 'three'` in any eagerly-loaded file pulls in the whole of it -- it is
      # effectively not tree-shakeable here, measured: the initial total goes from 656 kB to
      # 1.20 MB, which does not even build under the 1 MB budget.
      #
      # Same shape as the two checks above -- grep the built bundle for strings the bundler
      # cannot rename -- with one difference that is the whole of the design. three.js is
      # *expected* in the lazy viewer chunk, so absence from the build is not the property;
      # absence from the chunks index.html loads before any route is. Those are read out of
      # index.html rather than listed here, because their names are content-hashed.
      #
      # The markers are error and shader strings from three's own source — five from the core
      # and one from each of the four addons the viewer imports, so a leak through any single
      # import is caught. Strings and not identifiers or paths: the minifier mangles the first
      # and bundling rewrites the second into hashed chunk names, while these survive verbatim.
      # A marker that matches nothing anywhere fails just as loudly as one in an initial chunk:
      # task 1 shipped two markers that matched nothing at all, and a marker that can never be
      # found cannot detect a leak.
      #
      # What green means, exactly: none of these nine strings is in an initial chunk. That is the
      # property we want only because three.js does not tree-shake here, so any import of it drags
      # all nine in — a future three.js with working side-effect annotations, or a hand-copied
      # fragment of its maths, would pass this and still be in the first payload. A tripwire on
      # the failure mode that actually happens, not a proof of the general property.
      - name: three.js stays out of the initial bundle
        run: |
          markers='THREE.WebGLRenderer THREE.WebGLProgram THREE.Object3D WebGLShadowMap:'
          markers="$markers colorspace_fragment OrbitControls.js"
          markers="$markers THREE.STLLoader THREE.OBJLoader THREE.3MFLoader"
          status=0
          for root in packages/web/dist/web/browser packages/web/dist/electron/browser; do
            # ng deletes the output path before it builds, so a build that failed its budget
            # leaves nothing behind. An absent index.html therefore means this step has no
            # build to look at -- never that it looked and found nothing.
            if [ ! -f "$root/index.html" ]; then
              echo "::error::$root/index.html is missing; there is no build to check"
              status=1; continue
            fi
            initial=$(grep -oE '(src|href)="[^"]+\.js"' "$root/index.html" | cut -d'"' -f2)
            if [ -z "$initial" ]; then
              echo "::error::$root/index.html loads no scripts; cannot tell which chunks are initial"
              status=1; continue
            fi
            for marker in $markers; do
              # `|| true` so this survives `pipefail` being turned on. It is a no-op under the
              # default `bash -e {0}`, where a pipeline's status is the last command's and `sed`
              # always succeeds; adding `shell: bash` here would set `pipefail`, and without this
              # the no-match case would kill the step before the error below could be printed.
              hits=$(cd "$root" && grep -lF -- "$marker" ./*.js | sed 's|^\./||') || true
              if [ -z "$hits" ]; then
                echo "::error::three.js marker '$marker' is in no chunk of $root; three.js has renamed or dropped it, so it can no longer detect a leak -- pick another string from the same module"
                status=1; continue
              fi
              for chunk in $initial; do
                if printf '%s\n' "$hits" | grep -qxF "$chunk"; then
                  echo "::error::three.js reached an initial chunk: '$marker' is in $root/$chunk, which index.html loads before any route. Something outside the viewer's lazy route imports three."
                  status=1
                fi
              done
            done
          done
          exit $status

  e2e:
    runs-on: ubuntu-latest
    # A hung webServer would otherwise sit on the runner default of six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: deno install --allow-scripts --frozen
      - run: cd packages/web && node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: deno task e2e

  # The Electron shell. Everything between checkout and `deno task test:desktop` was measured in
  # an ubuntu:24.04 container, not taken from documentation: each step below is there because
  # removing it produced a specific, named failure.
  desktop:
    runs-on: ubuntu-latest
    # The suite builds the Angular electron bundle before it launches anything, and a wedged
    # xvfb or a hung Electron start is not something Playwright's per-test timeout always sees.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: deno install --allow-scripts --frozen
      # The dispatch table under plain Node, before anything downloads a 100 MB browser: it is
      # the bulk of what the desktop package does, it needs no display and no Electron, and a
      # failure in it should not arrive twenty steps later disguised as a GUI timeout. It is in
      # `deno task verify` as well -- ruling C-5 keeps the *Playwright* suite out of verify, not
      # this one.
      - run: deno task test:desktop:unit
      # Electron 44 has no postinstall script at all -- its package.json has no `scripts` key --
      # so `deno install --allow-scripts` writes the JS wrapper and stops. Measured: afterwards
      # there is no `dist/` under node_modules/electron. Two consequences. One, the ~100 MB
      # binary has to be asked for, and it is asked for here so a download failure lands in a
      # step named for it rather than in a test timeout (electron's own cli.js would otherwise
      # fetch it lazily on first launch). Two, no other job pays for it: they install the same
      # workspace and get the same few hundred kilobytes of wrapper.
      - run: node node_modules/electron/install.js
      # Electron is Chromium and links Chromium's shared libraries. `install-deps` installs them
      # without downloading a browser -- the e2e job's `install --with-deps` does both, and this
      # job has no use for Playwright's Chromium. libgtk-3 is Electron's alone: Chromium's
      # headless shell does not link it, so it is not on Playwright's list, and without it the
      # binary dies with `error while loading shared libraries: libgtk-3.so.0`.
      - run: |
          node node_modules/@playwright/test/cli.js install-deps chromium
          sudo apt-get install -y libgtk-3-0t64 || sudo apt-get install -y libgtk-3-0
      # npm ships chrome-sandbox owned by the installing user and without its setuid bit, and
      # Electron aborts rather than start unsandboxed: "The SUID sandbox helper binary was
      # found, but is not configured correctly." Chromium's other route, an unprivileged user
      # namespace, is what Ubuntu 24.04 restricts through AppArmor. Both are repaired here
      # rather than papered over with --no-sandbox, which would switch the OS sandbox off for
      # the whole run -- a different thing from webPreferences.sandbox, but not one to give up
      # in the job that exists to prove the shell starts.
      - run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # xvfb-run, and not a headless switch: Electron has no headless mode for a BrowserWindow,
      # and these tests assert on a laid-out, painted page. `-a` picks a free display number.
      # The suite builds first (test/build.setup.ts) and fails the run if the build wrote
      # nothing, so this cannot pass against a stale bundle -- and it cannot pass without
      # launching, either: every assertion in it is on a window that opened.
      - run: xvfb-run -a deno task test:desktop
